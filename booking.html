<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Page</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 90px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.3);
      z-index:0;
    }

    main {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.95);
      padding: 2rem 2.5rem;
      border-radius: 20px;
      box-shadow: 20px 12px 1px rgba(0,0,0,0.2);
      position: relative;
      z-index:1;
    }

    header h1 {
      color: #0e5c60;
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #ffffff);
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.205);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    input:focus {
      border-color: #4facfe;
      box-shadow: 0 0 5px rgba(79, 172, 254, 0.5);
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .home-btn {
      margin-top: 15px;
      background: linear-gradient(90deg, #43e97b, #38f9d7);
    }

    .home-btn a {
      text-decoration: none;
      color: white;
      display: block;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1> Book Your Trip</h1>
    </header>

    <form id="form">
      <label>Destination</label>
      <input type="text" id="destination" required>

      <label>Name</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Phone</label>
      <input type="text" id="phone" required>

      <label>Date</label>
      <input type="date" id="date" required>

      <label>Time</label>
      <input type="time" id="time" required>

      <label>No. of People</label>
      <input type="number" id="people" required>

      <button type="submit">✅ Confirm Booking</button>
      <button type="button" class="home-btn"><a href="index.html">🏠 Redirect to Home Page</a></button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const booking = {
        destination: document.getElementById("destination").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        people: document.getElementById("people").value
      };

      let plans = JSON.parse(localStorage.getItem("myPlans")) || [];
      plans.push(booking);
      localStorage.setItem("myPlans", JSON.stringify(plans));

      window.location.href = "plans.html";
    });
  </script>
</body>
</html>
