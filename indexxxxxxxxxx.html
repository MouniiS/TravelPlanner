<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Planner</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111827;
      --card-bg: rgba(255,255,255,0.8);
      --nav-bg: rgba(255,255,255,0.7);
      --btn-bg: linear-gradient(135deg,#06b6d4,#3b82f6);
    }
    body.dark-mode {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: rgba(30,41,59,0.85);
      --nav-bg: rgba(15,23,42,0.6);
      --btn-bg: linear-gradient(135deg,#6366f1,#8b5cf6);
    }
    * {margin:0; padding:0; box-sizing:border-box; font-family:Poppins,sans-serif;}
    body { background:var(--bg-color); color:var(--text-color); transition:0.4s; overflow-x:hidden; }
    header { display:flex; justify-content:space-between; align-items:center; padding:1rem 2rem; background:var(--nav-bg); backdrop-filter:blur(12px); position:sticky; top:0; z-index:1000;}
    header h1{ font-size:1.8rem; }
    .header-buttons{ display:flex; align-items:center; gap:12px;}
    #theme-toggle{ background:none; border:none; font-size:1.5rem; cursor:pointer;}
    .logout-btn, .plans-btn ,.about-btn{ background-color:#fff; padding:6px 16px; border-radius:20px; box-shadow:3px 3px 5px rgba(0,0,0,0.3); cursor:pointer; font-weight:bold; border:none;}
    .hero{ position:relative; height:100vh; overflow:hidden;}
    .hero-video{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2;}
    .hero-overlay{ position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:-1;}
    .hero-content{ height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; color:#fff;}
    .hero-content h1{ font-size:3.5rem; margin-bottom:10px; text-shadow:2px 2px 10px rgba(0,0,0,0.6);}
    .hero-content p{ font-size:1.5rem; margin-bottom:20px;}
    .btn{ display:inline-block; padding:12px 25px; background:var(--btn-bg); border:none; border-radius:30px; color:#fff; font-weight:bold; cursor:pointer; transition:0.3s; text-decoration:none;}
    .btn:hover{ transform:scale(1.05); box-shadow:0 6px 20px rgba(0,0,0,0.25);}
    .destinations{ padding:70px 20px; text-align:center;}
    .destinations h2{ font-size:2.8rem; margin-bottom:50px;}
    .cards{ display:flex; justify-content:center; gap:30px; flex-wrap:wrap;}
    .card{ background:var(--card-bg); border-radius:18px; overflow:hidden; width:320px; box-shadow:0 6px 20px rgba(0,0,0,0.15); transition:transform 0.4s, box-shadow 0.4s; backdrop-filter:blur(10px);}
    .card img{ width:100%; height:220px; object-fit:cover;}
    .card h3{ margin:20px; font-size:1.5rem;}
    .card p{ margin:0 20px 20px; font-size:0.95rem; color:var(--text-color);}
    .card .btn{ margin:0 20px 20px; width:calc(100% - 40px);}
    .card:hover{ transform:translateY(-12px) scale(1.02); box-shadow:0 12px 30px rgba(0,0,0,0.25);}
  </style>
</head>
<body>

<header>
  <h1>Travel Planner</h1>
  <div class="header-buttons">
    <button id="theme-toggle">🌙</button>
    <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
    <button class="signup-btn" onclick="window.location.href='signup.html'">Signup</button>
  </div>
</header>

<section class="hero">
  <video autoplay muted loop playsinline class="hero-video">
    <source src="assets/hero.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Predicting Heart Disease</h1>
    <p>----------------</p>
  </div>
</section>


<script>
const toggleBtn = document.getElementById("theme-toggle");
toggleBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  toggleBtn.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
});

const cardsContainer = document.querySelector(".cards");
destinationsData.forEach(dest => {
  const card = document.createElement("div");
  card.className = "card";
  card.setAttribute("data-destination", dest.name.split(",")[0]);
  card.innerHTML = `
    <img src="${dest.image}" alt="${dest.name}">
    <h3>${dest.name}</h3>
    <p>${dest.desc}</p>
    <button class="btn book-btn" data-url="booking.html?destination=${encodeURIComponent(dest.name.split(",")[0])}">Book Now</button>
  `;
  cardsContainer.appendChild(card);
});

</script>

</body>
</html>
